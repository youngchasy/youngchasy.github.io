    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeUrl(value = "#") {
      const url = String(value || "#").trim();
      return /^(https?:\/\/|mailto:|tel:|#|\.\/|\/)/i.test(url) ? escapeHtml(url) : "#";
    }

    function getEmbeddedDefault() {
      return JSON.parse(document.getElementById("embeddedDefaultContent").textContent);
    }

    async function loadContent() {
      const embedded = getEmbeddedDefault();

      if (DRAFT_PARAM === "1") {
        try {
          const draft = localStorage.getItem(STORAGE_KEY);
          if (draft) {
            document.getElementById("draftBadge").classList.add("visible");
            return { ...embedded, ...JSON.parse(draft) };
          }
        } catch (error) {
          console.warn("Draft load error:", error);
        }
      }

      try {
        const response = await fetch("./content.json", { cache: "no-store" });
        if (!response.ok) throw new Error("content.json not found");
        return { ...embedded, ...await response.json() };
      } catch (error) {
        return embedded;
      }
    }

    function fillText(id, value, fallback = "") {
      const element = document.getElementById(id);
      if (element) element.textContent = value || fallback;
    }

      const lines = String(value || "Код.\nМузыка.\nДизайн.")

        .filter(Boolean);

      title.innerHTML = lines.map((line, index) => `
        <span class="title-line">
          <span class="title-word">${escapeHtml(line)}</span>
        </span>
      `).join("");
    }

        <article class="service-row reveal liquid-surface liquid-panel" style="--delay:${index * 60}ms">
          <span class="service-index">${String(index + 1).padStart(2, "0")}</span>
          <h3 class="service-title">${escapeHtml(service.title)}</h3>
          <p class="service-description">${escapeHtml(service.description)}</p>
          <span class="service-icon" aria-hidden="true">${escapeHtml(service.icon || "·")}</span>
        </article>
      `).join("");
    }

    function isAllCategory(value) {
      return /^(все|all)$/i.test(String(value || "").trim());
    }

    function getCategories() {
      const raw = Array.isArray(siteData.portfolioCategories) ? siteData.portfolioCategories : [];
      const categories = raw.map(label => ({
        label: String(label),
        value: isAllCategory(label) ? ALL_CATEGORY : String(label)
      }));

      if (!categories.some(item => item.value === ALL_CATEGORY)) {
        categories.unshift({ label: "все", value: ALL_CATEGORY });
      }

      return categories.filter((item, index, list) =>
        list.findIndex(candidate => candidate.value.toLowerCase() === item.value.toLowerCase()) === index
      );
    }

    function renderPortfolioControls() {
      const controls = document.getElementById("portfolioControls");
      const categories = getCategories();

      controls.innerHTML = categories.map((category, index) => `
        <button
          class="filter-button liquid-surface liquid-pill ${category.value === activeCategory ? "active" : ""}"
          type="button"
          data-index="${index}"
          aria-pressed="${category.value === activeCategory}"
        >${escapeHtml(category.label)}</button>
      `).join("");

      controls.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          activeCategory = categories[Number(button.dataset.index)].value;
          renderPortfolioControls();
          renderPortfolioItems();
        });
      });
    }

    function projectInitials(title = "") {
      return String(title).split(/\s+/).filter(Boolean).slice(0, 2).map(word => word[0]).join("");
    }

    function renderPortfolioItems() {
      const grid = document.getElementById("casesGrid");
      const allItems = Array.isArray(siteData.portfolioItems) ? siteData.portfolioItems : [];
      const items = activeCategory === ALL_CATEGORY
        ? allItems
        : allItems.filter(item => String(item.category).toLowerCase() === activeCategory.toLowerCase());

      if (!items.length) {
        grid.innerHTML = `<p class="empty-state reveal">В этой категории пока нет работ.</p>`;
        observeReveal();
        return;
      }

      grid.innerHTML = items.map((item, index) => {
        const hasLink = item.link && item.link !== "#";
        const arrow = hasLink
          ? `<a class="project-arrow" href="${safeUrl(item.link)}" target="_blank" rel="noreferrer" aria-label="${escapeHtml(item.linkText || "Открыть проект")}">↗</a>`
          : `<span class="project-arrow" aria-hidden="true">↗</span>`;
        const media = item.image
          ? `<img src="${safeUrl(item.image)}" alt="${escapeHtml(item.title)}" loading="lazy" />`
          : `<span class="project-fallback">${escapeHtml(projectInitials(item.title))}</span>`;
        const audio = item.audio ? `
          <button class="audio-button liquid-surface liquid-pill" type="button" data-audio-id="audio-${index}">
            <span class="audio-icon" aria-hidden="true">▶</span>
            <span class="audio-label">Слушать</span>
          </button>
          <audio id="audio-${index}" preload="none" src="${safeUrl(item.audio)}"></audio>
        ` : "";

        return `
          <article class="project-card reveal liquid-surface liquid-panel" style="--delay:${Math.min(index * 70, 280)}ms">
            <div class="project-media">
              ${media}
              <span class="project-number">${String(index + 1).padStart(2, "0")}</span>
              <span class="project-category">${escapeHtml(item.category)}</span>
            </div>
            <div class="project-meta">
              <div>
                <h3 class="project-title">${escapeHtml(item.title)}</h3>
                <p class="project-description">${escapeHtml(item.description)}</p>
                ${audio}
              </div>
              ${arrow}
            </div>
          </article>
        `;
      }).join("");

      grid.querySelectorAll(".project-media img").forEach(image => {
        image.addEventListener("error", () => image.remove(), { once: true });
      });

      setupAudioPlayers();
      observeReveal();
    }

    function setupAudioPlayers() {
      document.querySelectorAll(".audio-button").forEach(button => {
        const audio = document.getElementById(button.dataset.audioId);
        const label = button.querySelector(".audio-label");
        const icon = button.querySelector(".audio-icon");
        if (!audio) return;

        const setState = playing => {
          button.classList.toggle("playing", playing);
          label.textContent = playing ? "Пауза" : "Слушать";
          icon.textContent = playing ? "Ⅱ" : "▶";
        };

        button.addEventListener("click", async () => {
          document.querySelectorAll("audio").forEach(other => {
            if (other !== audio) other.pause();
          });

          if (audio.paused) {
            try { await audio.play(); } catch (error) { setState(false); }
          } else {
            audio.pause();
          }
        });

        audio.addEventListener("play", () => setState(true));
        audio.addEventListener("pause", () => setState(false));
        audio.addEventListener("ended", () => setState(false));
      });
    }

    function renderContacts(primary = [], social = []) {
      const items = [...primary, ...social];
      document.getElementById("contactLinks").innerHTML = items.map(item => `
        <a class="contact-link liquid-surface liquid-pill" href="${safeUrl(item.href)}" target="_blank" rel="noreferrer">
          ${icons[item.icon] || ""}
          <span>${escapeHtml(item.label)}</span>
          <span class="link-arrow" aria-hidden="true">↗</span>
        </a>
      `).join("");
    }

    function observeReveal() {
      const elements = document.querySelectorAll(".reveal:not(.visible)");
      if (!elements.length) return;

      if (reduceMotion || !("IntersectionObserver" in window)) {
        elements.forEach(element => element.classList.add("visible"));
        return;
      }

      if (!revealObserver) {
        revealObserver = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add("visible");
              revealObserver.unobserve(entry.target);
            }
          });
        }, { threshold: .12, rootMargin: "0px 0px -5%" });
      }

      elements.forEach(element => revealObserver.observe(element));
    }

    function setupTopbar() {
      const topbar = document.getElementById("topbar");
      const update = () => topbar.classList.toggle("scrolled", window.scrollY > 18);
      update();
      window.addEventListener("scroll", update, { passive: true });
    }

    function setupPointerEffects() {
      if (reduceMotion || !window.matchMedia("(pointer: fine)").matches) return;

      let frame = null;
      window.addEventListener("pointermove", event => {
        document.body.classList.add("pointer-active");
        if (frame) cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          document.documentElement.style.setProperty("--pointer-x", `${event.clientX}px`);
          document.documentElement.style.setProperty("--pointer-y", `${event.clientY}px`);
        });
      }, { passive: true });

      document.querySelectorAll(".magnetic").forEach(element => {
        element.addEventListener("pointermove", event => {
          const rect = element.getBoundingClientRect();
          const x = (event.clientX - rect.left - rect.width / 2) * .12;
          const y = (event.clientY - rect.top - rect.height / 2) * .18;
          element.style.setProperty("--mx", `${x}px`);
          element.style.setProperty("--my", `${y}px`);
        });
        element.addEventListener("pointerleave", () => {
          element.style.setProperty("--mx", "0px");
          element.style.setProperty("--my", "0px");
        });
      });
    }

    function setupHeroMotion() {
      if (reduceMotion) return;
      const art = document.getElementById("heroArt");
      let ticking = false;

      const update = () => {
        art.style.setProperty("--hero-shift", `${window.scrollY * .1}px`);
        ticking = false;
      };

      window.addEventListener("scroll", () => {
        if (!ticking) {
          requestAnimationFrame(update);
          ticking = true;
        }
      }, { passive: true });
    }

    function setHeroImage(value) {
      const image = String(value || "").trim();
      if (!/^(https?:\/\/|\.\/|\/)/i.test(image)) return;
      const safeImage = image.replace(/["'()\\]/g, "");
      document.documentElement.style.setProperty("--hero-image", `url("${safeImage}")`);
    }

    function renderAll(data) {
      siteData = data;

      fillText("brandName", data.brand, "youngchasy");
      fillText("footerName", data.domain, "youngchasy.site");
      fillText("footerText", data.footerText);
      fillText("heroSubtitle", data.heroSubtitle);
      fillText("heroPrimaryButton", data.heroPrimaryButton, "Смотреть работы");
      fillText("heroSecondaryButton", data.heroSecondaryButton, "Связаться");
      fillText("portfolioSectionTitle", data.portfolioSectionTitle, "Мои работы");
      fillText("portfolioSectionText", data.portfolioSectionText);
      fillText("contactTitle", data.contactTitle, "Есть идея?");
      fillText("contactText", data.contactText, "Напиши — обсудим задачу и найдём точный формат.");

      document.title = `${data.brand || "youngchasy"} — портфолио`;
      fillHeroTitle(data.heroTitle);
      renderStats(data.stats || []);
      renderServices(data.services || []);
      renderContacts(data.contactButtons || [], data.socialLinks || []);
      renderPortfolioControls();
      renderPortfolioItems();
      setHeroImage(data.backgroundImage);

      requestAnimationFrame(() => {
        document.body.classList.add("ready");
        observeReveal();
      });
    }

    setupTopbar();
    setupPointerEffects();
    setupHeroMotion();
    loadContent().then(renderAll);
  </script>
  
  <script>
    (() => {
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const smoothstep = t => t * t * (3 - 2 * t);

      function roundedRectSdf(x, y, width, height, radius) {
        const cx = width / 2;
        const cy = height / 2;
        const qx = Math.abs(x - cx) - (width / 2 - radius);
        const qy = Math.abs(y - cy) - (height / 2 - radius);
        const outside = Math.hypot(Math.max(qx, 0), Math.max(qy, 0));
        const inside = Math.min(Math.max(qx, qy), 0);
        return outside + inside - radius;
      }

      function makeLiquidMaps(width, height, radius, bezel) {
        const displacementCanvas = document.createElement('canvas');
        const specularCanvas = document.createElement('canvas');
        displacementCanvas.width = specularCanvas.width = width;
        displacementCanvas.height = specularCanvas.height = height;

        const dctx = displacementCanvas.getContext('2d', { willReadFrequently: false });
        const sctx = specularCanvas.getContext('2d', { willReadFrequently: false });
        const dimg = dctx.createImageData(width, height);
        const simg = sctx.createImageData(width, height);
        const d = dimg.data;
        const s = simg.data;
        const lightX = -0.78;
        const lightY = -0.62;

        const sdf = (x, y) => roundedRectSdf(x, y, width, height, radius);

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const i = (y * width + x) * 4;
            const signed = sdf(x + .5, y + .5);

            d[i] = d[i + 1] = d[i + 2] = 128;
            d[i + 3] = 255;
            s[i] = s[i + 1] = s[i + 2] = 255;
            s[i + 3] = 0;

            if (signed > 0) continue;
            const distance = -signed;
            if (distance > bezel) continue;

            // Gradient of the rounded-rect SDF gives the surface normal.
            const eps = 1.15;
            let gx = (sdf(x + eps, y) - sdf(x - eps, y)) / (2 * eps);
            let gy = (sdf(x, y + eps) - sdf(x, y - eps)) / (2 * eps);
            const gl = Math.hypot(gx, gy) || 1;
            gx /= gl;
            gy /= gl;

            // Convex-squircle-inspired bezel: strongest refraction at the rim,
            // easing rapidly toward the flat center of the glass.
            const t = clamp(distance / bezel, 0, 1);
            const squircleHeight = Math.pow(Math.max(0, 1 - Math.pow(1 - t, 4)), .25);
            const rim = 1 - smoothstep(t);
            const optical = clamp((1 - squircleHeight) * 1.45 + rim * .62, 0, 1);

            // Convex profile bends sampled pixels inward, keeping displacement inside the surface.
            const dx = -gx * optical;
            const dy = -gy * optical;
            d[i] = Math.round(clamp(128 + dx * 127, 0, 255));
            d[i + 1] = Math.round(clamp(128 + dy * 127, 0, 255));

            // Fixed-direction rim light, matching the article's specular-highlight stage.
            const facing = Math.max(0, gx * lightX + gy * lightY);
            const spec = Math.pow(facing, 7) * Math.pow(rim, .72);
            s[i + 3] = Math.round(clamp(spec * 115, 0, 110));
          }
        }

        dctx.putImageData(dimg, 0, 0);
        sctx.putImageData(simg, 0, 0);
        return {
          displacement: displacementCanvas.toDataURL('image/png'),
          specular: specularCanvas.toDataURL('image/png')
        };
      }

      function installFilterMaps() {
        try {
          const panel = makeLiquidMaps(512, 300, 46, 42);
          const pill = makeLiquidMaps(512, 112, 54, 32);
          document.getElementById('liquidPanelMap')?.setAttribute('href', panel.displacement);
          document.getElementById('liquidPanelSpecular')?.setAttribute('href', panel.specular);
          document.getElementById('liquidPillMap')?.setAttribute('href', pill.displacement);
          document.getElementById('liquidPillSpecular')?.setAttribute('href', pill.specular);

          // Kube's SVG-filter-as-backdrop technique is Chromium-specific; other browsers keep the CSS blur fallback.
          const isChromium = /Chrome|Chromium|Edg\//.test(navigator.userAgent) && !/OPR\//.test(navigator.userAgent);
          if (isChromium) document.documentElement.classList.add('chromium-liquid');
        } catch (error) {
          console.warn('Liquid glass fallback enabled:', error);
        }
      }

      function setupGlassPointerLight() {
        if (!window.matchMedia('(pointer:fine)').matches) return;
        document.addEventListener('pointermove', event => {
          const target = event.target.closest?.('.liquid-surface');
          if (!target) return;
          const rect = target.getBoundingClientRect();
          const x = ((event.clientX - rect.left) / rect.width) * 100;
          const y = ((event.clientY - rect.top) / rect.height) * 100;
          target.style.setProperty('--glass-x', `${x}%`);
          target.style.setProperty('--glass-y', `${y}%`);
        }, { passive: true });
      }

      installFilterMaps();
      setupGlassPointerLight();
    })();
  </script>
